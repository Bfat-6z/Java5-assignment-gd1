<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Trang quản trị'">Trang quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #343a40; color: white; position: fixed; width: 250px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px 15px; }
        .sidebar a:hover { background-color: #495057; }
        .content { margin-left: 250px; padding: 20px; }
    </style>
</head>
<body>
<!-- Sidebar fragment -->
<div th:replace="~{admin/layout/fragments/sidebar :: sidebar}"></div>

<div class="content">
    <main th:fragment="content">
        <!-- Header fragment -->
        <div th:replace="~{admin/layout/fragments/header :: header}"></div>
        <!-- Placeholder: Nội dung từ list.html sẽ insert vào đây -->
        <div th:insert="~{}"></div>  <!-- Placeholder rỗng cho insert -->
    </main>
</div>
</body>
</html>
