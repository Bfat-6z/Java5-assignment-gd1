<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Trang quản trị'">Trang quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; background-color: #343a40; color: white; position: fixed; width: 250px; z-index: 1000; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px 15px; }
        .sidebar a:hover { background-color: #495057; }
        .content { margin-left: 250px; padding: 20px; }
        .dashboard-hero {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            border-radius: 15px;
            padding: 2rem;
        }
        .header { background-color: #fff; border-bottom: 1px solid #dee2e6; padding: 15px 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
    </style>
</head>
<body th:fragment="layout(content, title)">  <!-- Chỉ nhận content (bao gồm header từ child) và title -->
<!-- Sidebar: Include tĩnh -->
<div th:insert="~{admin/layout/fragments/sidebar :: sidebar}"></div>

<div class="content">
    <!-- Placeholder: Thay thế bằng toàn bộ content từ child (header + main, không fallback) -->
    <th:block th:replace="${content}">
        <!-- Không có fallback nữa để tránh duplicate -->
    </th:block>
</div>
</body>
</html>
