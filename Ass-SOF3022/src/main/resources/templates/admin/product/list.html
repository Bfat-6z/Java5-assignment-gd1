<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 15px;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .btn-primary {
            border-radius: 10px;
        }

        table th {
            background-color: #0d6efd !important;
            color: white;
            font-weight: 500;
        }

        table tbody tr:hover {
            background-color: #f2f6ff;
            transition: all 0.2s ease-in-out;
        }

        .badge {
            font-size: 0.95rem;
            padding: 0.5em 0.75em;
        }

        .alert {
            border-radius: 10px;
        }

        .btn-outline-warning:hover {
            background-color: #fff3cd;
        }

        .btn-outline-danger:hover {
            background-color: #f8d7da;
        }
    </style>
</head>

<body th:fragment="page-content">
<div class="container py-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">
            <i class="bi bi-box-seam-fill me-2"></i> Quản lý sản phẩm
        </h2>
        <a href="#" class="btn btn-primary px-4 shadow-sm">
            <i class="bi bi-plus-circle me-2"></i> Thêm sản phẩm
        </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${list != null and not #lists.isEmpty(list)}"
         class="alert alert-info d-flex align-items-center justify-content-between fade show mb-4" role="alert">
        <div>
            <i class="bi bi-info-circle me-2"></i>
            Tổng sản phẩm: <strong th:text="${#lists.size(list)}">0</strong>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${list == null or #lists.isEmpty(list)}"
         class="alert alert-warning d-flex align-items-center justify-content-between fade show mb-4" role="alert">
        <div>
            <i class="bi bi-exclamation-triangle me-2"></i>
            Không có sản phẩm nào!
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Bảng sản phẩm -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col" class="py-3 ps-4">Mã SP</th>
                        <th scope="col" class="py-3">Tên sản phẩm</th>
                        <th scope="col" class="py-3 text-end">Giá</th>
                        <th scope="col" class="py-3 text-center">Tồn kho</th>
                        <th scope="col" class="py-3 text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${list}">
                        <td th:text="${p.id}" class="fw-medium ps-4"></td>
                        <td th:text="${p.name}" class="text-dark fw-semibold"></td>
                        <td class="text-end">
                            <span class="badge bg-success"
                                  th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 2, 'COMMA') + ' ₫'}"></span>
                        </td>
                        <td th:text="${p.quantity}" class="text-center text-warning fw-bold"></td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
                                   class="btn btn-outline-warning border-0 shadow-none"
                                   title="Sửa" data-bs-toggle="tooltip">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
                                   class="btn btn-outline-danger border-0 shadow-none"
                                   onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')"
                                   title="Xóa" data-bs-toggle="tooltip">
                                    <i class="bi bi-trash3"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Phân trang-->
    <!--
    <nav aria-label="Pagination" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled"><a class="page-link">Trước</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">Sau</a></li>
        </ul>
    </nav>
    -->
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
    /*]]>*/
</script>
</body>
</html>
